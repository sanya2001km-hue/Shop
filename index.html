        async function initLoadingScreen() {
            const loadingScreen = document.getElementById('loading-screen');
            const progressBar = document.getElementById('loading-progress');
            const percentText = document.getElementById('loading-percent');
            const loadingText = document.getElementById('loading-text');
            
            let progress = 0;
            const steps = [
                { text: "Загрузка данных...", progress: 20 },
                { text: "Получение курса валют...", progress: 40 },
                { text: "Проверка профиля...", progress: 60 },
                { text: "Загрузка товаров...", progress: 80 },
                { text: "Завершение...", progress: 100 }
            ];
            
            const interval = setInterval(() => {
                if (progress < 100) {
                    progress += 2;
                    if (progress > 100) progress = 100;
                    
                    progressBar.style.width = `${progress}%`;
                    percentText.textContent = `${progress}%`;
                    
                    const currentStep = steps.find(step => progress <= step.progress);
                    if (currentStep) {
                        loadingText.textContent = currentStep.text;
                    }
                }
                
                if (progress >= 100) {
                    clearInterval(interval);
                    
                    setTimeout(() => {
                        loadingScreen.classList.add('hidden');
                        
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                            setTimeout(async () => {

                                initApp();
                            }, 50);
                        }, 500);
                    }, 300);
                }
            }, 50);

        async function getOrdersFromServer(telegramId) {
            try {
                const response = await fetch(`${CONFIG.HISTORY_API_URL}?user_id=${telegramId}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ошибка: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    return result.orders || [];
                } else {
                    throw new Error(result.message || 'Ошибка сервера');
                }
                
            } catch (error) {
                console.warn('Не удалось получить заказы с сервера:', error);
                return getOrdersFromLocalStorage();
            }
        }

        function getOrdersFromLocalStorage() {
            const orders = [];
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                
                if (key.startsWith('order_') && !key.includes('failed') && !key.includes('success')) {
                    try {
                        const orderData = JSON.parse(localStorage.getItem(key));
                        const orderId = key.replace('order_', '');
                        
                        orders.push({
                            order_id: orderId,
                            product_name: orderData.product?.name || 'Неизвестно',
                            price: orderData.product?.price || 0,
                            status: orderData.status || 'pending',
                            created_at: orderData.timestamp || new Date().toISOString()
                        });
                    } catch (e) {
                        console.warn('Ошибка чтения заказа:', key, e);
                    }
                }
            }
            
            return orders.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        }

                        sent_at: new Date().toISOString()
                    }));
                    
                    showOrderStatus(orderId);
                } else {
                    alert('⚠️ Заказ сохранен локально, но не отправлен на сервер.\nАдминистратор свяжется с вами для уточнения деталей.');
                    showOrderStatus(orderId, true);
                }
                
            } catch (error) {
                console.error('❌ Критическая ошибка:', error);
                document.getElementById('loading').style.display = 'none';
                alert('⚠️ Произошла ошибка при обработке заказа.\nВаш заказ сохранен локально.\nАдминистратор @astmatiks_exe свяжется с вами для уточнения деталей.');
                showMain();
            }
        }

        async function sendOrderToBot(order) {
            console.log('📦 Отправка заказа в бот:', order.id);
            
            try {
                if (!order.userData || !order.product || !order.playerId) {
                    console.error('❌ Неполные данные заказа');
                    return false;
                }
                
                const orderData = {
                    order_id: order.id,
                    user_id: order.userData.telegramId || '',
                    username: order.userData.username || '',
                    first_name: order.userData.firstName || '',
                    product_name: order.product.name,
                    price: order.product.price,
                    player_id: order.playerId,
                    payment_method: order.paymentMethod || 'не указан',
                    timestamp: new Date().toISOString()
                };
                
                if (order.paymentMethod === 'crypto') {
                    orderData.crypto_invoice_id = order.cryptoInvoice?.invoice_id || '';
                    orderData.amount_usdt = order.usdtAmount || calculateUsdtAmount(order.product.price);
                    orderData.exchange_rate = order.exchangeRate || currentState.exchangeRate;
                    orderData.amount_rub = order.rubAmount || order.product.price;
                }
                
                console.log('📤 Данные для API:', orderData);
                
                const response = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(orderData)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ошибка: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('✅ Ответ API:', result);
                
                if (result.status === 'success') {
                    console.log('🎉 Заказ успешно создан!');
                    
                    localStorage.setItem(`order_success_${order.id}`, JSON.stringify({
                        ...orderData,
                        status: 'success',
                        server_response: result
                    }));
                    
                    // Отправляем уведомление покупателю через бота
                    await sendUserNotification(orderData);
                    
                    return true;
                } else {
                    throw new Error(result.message || 'Ошибка от сервера');
                }
                
            } catch (error) {
                console.error('❌ Ошибка отправки заказа:', error);
                
                // Пробуем альтернативный метод
                return await sendOrderViaTelegramBot(order);
            }
        }

                if (orderData.user_id && orderData.user_id !== CONFIG.ADMIN_ID) {
                    const message = `

✅ *Ваш заказ принят в обработку*

📦 *Детали заказа:*
├ Товар: ${orderData.product_name}
├ Сумма: ${orderData.price}₽
├ ID игрока: ${orderData.player_id}
├ Способ оплаты: ${orderData.payment_method}
├
👤 *Ваши данные:*
├ Имя: ${orderData.first_name}
├ Telegram: @${orderData.username}
├

💡 *Что дальше?*

                    `;
                    
                    const telegramUrl = `https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`;
                    
                    await fetch(telegramUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },

            try {
                let messageText = `

├ Номер: #${order.currentOrder.id}

                }

                `;
                
                const telegramUrl = `https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`;
                
                const response = await fetch(telegramUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({

                        text: messageText,
                        parse_mode: 'Markdown',

                if (!response.ok) {

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Скопировано!';
                btn.style.background = 'var(--success-green)';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = 'transparent';
                }, 2000);
            }).catch(err => {
                console.error('Ошибка копирования: ', err);
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const btn = event.target;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Скопировано!';
                btn.style.background = 'var(--success-green)';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = 'transparent';
                }, 2000);
            });
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').style.display = 'none';
        }

        function closeHelpModal() {
            document.getElementById('help-modal').style.display = 'none';
        }

        function showHelp() {
            document.getElementById('help-modal').style.display = 'flex';
        }

        document.addEventListener('click', function(event) {
            const paymentModal = document.getElementById('payment-modal');
            const helpModal = document.getElementById('help-modal');
            
            if (paymentModal.style.display === 'flex' && event.target === paymentModal) {
                closePaymentModal();
            }
            
            if (helpModal.style.display === 'flex' && event.target === helpModal) {
                closeHelpModal();
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closePaymentModal();
                closeHelpModal();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                initLoadingScreen();
            }, 100);
            
            document.addEventListener('touchmove', function(event) {
                if (event.scale !== 1 && event.scale !== undefined) {
                    event.preventDefault();
                }
            }, { passive: false });
            
            document.addEventListener('touchstart', function() {}, {passive: true});
            
            if ('ontouchstart' in window) {
                document.body.style.overflow = 'auto';
                document.body.style.webkitOverflowScrolling = 'touch';
            }
        });
